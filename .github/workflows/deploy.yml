name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-sats-man
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, sats-man]
    timeout-minutes: 10
    steps:
      - name: Run deploy script
        run: /home/ubuntu/gamestr/deploy sats-man
